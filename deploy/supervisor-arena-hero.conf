[program:arena-hero-agent]
command=/bin/sh -c '. /data/arena-hero-agent/.env.protected && export ARENA_HERO_COOKIE && exec /data/arena-hero-agent/.venv/bin/python -m arena_agent --live --journal /data/arena-hero-agent/runtime/arena-agent.jsonl'
directory=/data/arena-hero-agent
environment=PYTHONUNBUFFERED="1",ARENA_HERO_COOKIE="[REDACTED]"
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/data/arena-hero-agent/runtime/supervisor.out.log
stderr_logfile=/data/arena-hero-agent/runtime/supervisor.err.log
stopasgroup=true
killasgroup=true
