[program:arena-hero-agent]
; PYTHON_BIN is rendered by ppxed-deploy.sh. Credentials stay only in .env.protected.
command=/bin/sh -c '. /data/arena-hero-agent/.env.protected && export ARENA_HERO_TOKEN && exec __ARENA_PYTHON_BIN__ -m arena_agent --live --journal /data/arena-hero-agent/runtime/arena-agent.jsonl'
directory=/data/arena-hero-agent
environment=PYTHONUNBUFFERED="1"
autostart=true
; Authentication/protocol failures must remain stopped for operator diagnosis.
autorestart=false
startsecs=3
stopwaitsecs=10
stdout_logfile=/data/arena-hero-agent/runtime/supervisor.out.log
stderr_logfile=/data/arena-hero-agent/runtime/supervisor.err.log
stopasgroup=true
killasgroup=true
