[program:arena-hero-agent]
command=/usr/bin/python3 -m arena_agent --fixture /data/arena-hero-agent/tests/fixtures/state.json --journal /data/arena-hero-agent/runtime/arena-agent.jsonl
directory=/data/arena-hero-agent
environment=PYTHONUNBUFFERED="1"
autostart=false
autorestart=false
startsecs=3
stopwaitsecs=10
stdout_logfile=/data/arena-hero-agent/runtime/supervisor.out.log
stderr_logfile=/data/arena-hero-agent/runtime/supervisor.err.log
stopasgroup=true
killasgroup=true
