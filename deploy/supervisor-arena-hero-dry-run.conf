[program:arena-hero-agent]
command=/data/arena-hero-agent/.venv/bin/python -m arena_agent --dry-run --journal /data/arena-hero-agent/runtime/arena-agent.jsonl
directory=/data/arena-hero-agent
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/data/arena-hero-agent/runtime/supervisor.out.log
stderr_logfile=/data/arena-hero-agent/runtime/supervisor.err.log
stopasgroup=true
killasgroup=true
